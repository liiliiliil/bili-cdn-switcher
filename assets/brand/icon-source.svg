<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Bili CDN Switcher</title>
  <desc>Five rounded B candidates in perspective; the second-nearest candidate is highlighted.</desc>

  <defs>
    <!-- Counterless, shallow-waisted B with a 18/26 upper/lower height ratio. -->
    <path id="b" d="M7 0H14C22 0 28 3.6 28 8.46C28 12.96 25.8 16.2 22.8 17C21.9 17.5 21.9 18.4 22.9 18.9C30 19.7 34 24.275 34 31.052C34 40.4 27 44 16.5 44H7C3.1 44 0 40.9 0 37V7C0 3.1 3.1 0 7 0Z"/>
  </defs>

  <!--
    The artwork is about 72×52 px and centered inside the 128 px canvas.
    Size, spacing and cyan intensity advance naturally from far to near.
    Pink alone marks selection; the selected candidate receives no extra scale.
  -->
  <use href="#b" transform="translate(27.94 62.72) scale(.62)" fill="#D9F2F7"/>
  <use href="#b" transform="translate(32.94 57.44) scale(.74)" fill="#BCE8F1"/>
  <use href="#b" transform="translate(39.94 51.28) scale(.88)" fill="#8BD8E8"/>
  <use href="#b" transform="translate(48.94 44.68) scale(1.03)" fill="#FB7299"/>
  <use href="#b" transform="translate(59.94 38.08) scale(1.18)" fill="#00A1D6"/>
</svg>
